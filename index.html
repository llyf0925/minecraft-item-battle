<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Minecraft Item Battle</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      background: #1a1a2e url('assets/icons/初始界面.png') center top / cover no-repeat fixed;
      font-family: 'Press Start 2P', 'Courier New', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 45px 20px 20px;
    }
    
    h1 {
      font-size: 22px;
      margin-bottom: 32px;
      color: #fff;
      text-shadow: 4px 4px 0 #3d3d3d, 6px 6px 0 #1a1a1a;
      letter-spacing: 2px;
    }
    
    #mainContainer {
      display: flex;
      flex-direction: row;
      align-items: flex-start;
      justify-content: center;
      gap: 100px;
      margin-top: 45px;
      margin-bottom: 32px;
    }
    
    .player-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }
    
    /* 2v2：每个玩家两个选择槽，水平并排（同一排） */
    .player-slots {
      display: flex;
      flex-direction: row;
      gap: 15px;
    }
    
    .player-slot {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    
    .player-label {
      color: #fff;
      font-size: 14px;
      text-shadow: 2px 2px 0 #000;
      padding: 8px 20px;
      background: #8b8b8b;
      border: 3px solid #000;
      border-top-color: #a8a8a8;
      border-left-color: #a8a8a8;
    }
    
    .mc-select-wrapper {
      position: relative;
      width: 200px;
    }
    
    .mc-select {
      width: 100%;
      padding: 12px 40px 12px 15px;
      font-family: 'Press Start 2P', monospace;
      font-size: 11px;
      background: #8b8b8b;
      color: #fff;
      border: 3px solid #000;
      border-top-color: #555;
      border-left-color: #555;
      box-shadow: inset 2px 2px 0 #000;
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
      background-image: url('data:image/svg+xml;charset=US-ASCII,<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="white"><path d="M9 14L3 7h12z"/></svg>');
      background-repeat: no-repeat;
      background-position: right 12px center;
    }
    
    .mc-select:hover { background-color: #9a9a9a; }
    .mc-select:focus { outline: none; border-color: #fff; }
    
    .item-preview-box {
      width: 220px;
      height: 220px;
      background: #c6c6c6;
      border: 4px solid #000;
      border-top-color: #fff;
      border-left-color: #fff;
      box-shadow: inset -4px -4px 0 #8b8b8b, 4px 4px 0 #000;
      display: flex;
      align-items: center;
      justify-content: center;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      overflow: hidden;
    }
    
    .item-preview-box img {
      width: 200px;
      height: 200px;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      background: #8b8b8b;
      border: 2px solid #000;
    }
    
    .item-preview-box .placeholder {
      color: #666;
      font-size: 10px;
      text-align: center;
      padding: 20px;
    }
    
    /* 1v1 / 2v2 模式切换按钮（MC 风格，选中态绿色+黄边高亮） */
    .mode-btn {
      background: #7d7d7d;
      border: 4px solid #000;
      border-top-color: #a8a8a8;
      border-left-color: #a8a8a8;
      color: #fff;
      font-family: 'Press Start 2P', monospace;
      font-size: 14px;
      padding: 12px 24px;
      width: 120px;
      height: 46px;
      cursor: pointer;
      text-shadow: 2px 2px 0 #000;
      box-shadow: inset -4px -4px 0 #555, 4px 4px 0 #000;
      transition: all 0.1s;
      line-height: 1;
      box-sizing: border-box;
    }
    .mode-btn:hover { background: #8b8b8b; }
    
    #startBtn {
      background: #7d7d7d;
      border: 4px solid #000;
      border-top-color: #a8a8a8;
      border-left-color: #a8a8a8;
      color: #fff;
      font-family: 'Press Start 2P', monospace;
      font-size: 16px;
      padding: 18px 60px;
      width: 200px;
      min-width: 200px;
      max-width: 200px;
      height: 60px;
      min-height: 60px;
      max-height: 60px;
      line-height: 1;
      flex: 0 0 200px;
      box-sizing: border-box;
      text-align: center;
      cursor: pointer;
      text-shadow: 2px 2px 0 #000;
      box-shadow: inset -4px -4px 0 #555, 4px 4px 0 #000;
      transition: all 0.1s;
      margin-top: 10px;
    }
    
    #startBtn:hover { background: #8b8b8b; transform: scale(1.05); }
    #startBtn:active { transform: scale(0.98); box-shadow: inset 4px 4px 0 #555; }
    #startBtn:disabled { background: #555; cursor: not-allowed; opacity: 0.6; }
    
    #gameContainer {
      display: none;
    }
    
    #battleFrame {
      position: relative;
      width: 800px;
      height: 560px;
      border: 6px solid #000;
      box-shadow: 0 0 0 4px #7d7d7d, 0 0 0 8px #000;
      background: #000;
      margin: 0 auto;
    }
    
    #gameCanvas {
      display: block;
      width: 800px;
      height: 560px;
      image-rendering: pixelated;
    }
    
    
    
    .info {
      margin-top: 15px;
      font-size: 8px;
      color: #8b8b8b;
      text-align: center;
      line-height: 2;
    }
    
    .info span { color: #2ecc71; }
  </style>
</head>
<body>
  <button id="musicBtn" title="音乐开关" style="
    position:fixed;top:24px;right:24px;z-index:999;
    background:#7d7d7d;border:4px solid #000;border-top-color:#a8a8a8;border-left-color:#a8a8a8;
    color:#fff;font-family:'Press Start 2P',monospace;font-size:20px;
    width:56px;height:56px;line-height:1;cursor:pointer;
    text-shadow:2px 2px 0 #000;box-shadow:inset -4px -4px 0 #555,4px 4px 0 #000;transition:all 0.1s;
  ">🎵</button>
  <h1>⚔️ MINECRAFT ITEM BATTLE ⚔️</h1>
  
  <!-- 对战模式切换：单个按钮，点击在 1v1 / 2v2 之间切换（按钮文字显示当前模式） -->
  <div id="modeToggle" style="display:flex;justify-content:center;margin:8px 0 20px 0;">
    <button id="modeToggleBtn" class="mode-btn mode-active">1v1</button>
  </div>
  
  <div id="mainContainer">
    <div class="player-card">
      <div class="player-slots">
        <div class="player-slot" id="slot1a">
          <div class="mc-select-wrapper">
            <select id="item1" class="mc-select"></select>
          </div>
          <div class="item-preview-box">
            <img id="preview1" src="" alt="物品预览" style="display:none;">
            <div class="placeholder" id="placeholder1">等待选择</div>
          </div>
        </div>
        <div class="player-slot" id="slot1b">
          <div class="mc-select-wrapper">
            <select id="item2" class="mc-select"></select>
          </div>
          <div class="item-preview-box">
            <img id="preview2" src="" alt="物品预览" style="display:none;">
            <div class="placeholder" id="placeholder2">等待选择</div>
          </div>
        </div>
      </div>
    </div>
    
    <div class="player-card">
      <div class="player-slots">
        <div class="player-slot" id="slot2a">
          <div class="mc-select-wrapper">
            <select id="item3" class="mc-select"></select>
          </div>
          <div class="item-preview-box">
            <img id="preview3" src="" alt="物品预览" style="display:none;">
            <div class="placeholder" id="placeholder3">等待选择</div>
          </div>
        </div>
        <div class="player-slot" id="slot2b">
          <div class="mc-select-wrapper">
            <select id="item4" class="mc-select"></select>
          </div>
          <div class="item-preview-box">
            <img id="preview4" src="" alt="物品预览" style="display:none;">
            <div class="placeholder" id="placeholder4">等待选择</div>
          </div>
        </div>
      </div>
    </div>
  </div>
  
  <div style="display:flex;gap:20px;margin-top:18px;">
    <button id="startBtn">开始</button>
    <button id="randomBtn" style="
      background:#7d7d7d;border:4px solid #000;border-top-color:#a8a8a8;border-left-color:#a8a8a8;
      color:#fff;font-family:'Press Start 2P',monospace;font-size:16px;padding:18px 60px;cursor:pointer;
      width:200px;min-width:200px;max-width:200px;height:60px;min-height:60px;max-height:60px;line-height:1;flex:0 0 200px;box-sizing:border-box;text-align:center;overflow:hidden;margin-top:10px;
      text-shadow:2px 2px 0 #000;box-shadow:inset -4px -4px 0 #555,4px 4px 0 #000;transition:all 0.1s;
    ">🎲 随机</button>
  </div>
  <br>
  <button id="guideBtn" style="
  margin-top: 24px;
  background: #7d7d7d;
  border: 4px solid #000;
  border-top-color: #a8a8a8;
  border-left-color: #a8a8a8;
  color: #fff;
  font-family: 'Press Start 2P', monospace;
  font-size: 16px;
  padding: 18px 60px;
  width: 200px;
  min-width: 200px;
  max-width: 200px;
  height: 60px;
  min-height: 60px;
  max-height: 60px;
  line-height: 1;
  box-sizing: border-box;
  text-align: center;
  cursor: pointer;
  text-shadow: 2px 2px 0 #000;
  box-shadow: inset -4px -4px 0 #555, 4px 4px 0 #000;
  transition: all 0.1s;
">图鉴</button>
  
  <div id="guideOverlay" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:url('assets/icons/初始界面.png') center top / cover no-repeat;z-index:200;padding:30px;box-sizing:border-box;">
    <div style="max-width:700px;margin:0 auto;height:calc(100vh - 60px);display:flex;flex-direction:column;background:#8b8b8b;border:6px solid #000;border-top-color:#a8a8a8;border-left-color:#a8a8a8;padding:30px;box-sizing:border-box;font-family:'Press Start 2P',monospace;">
      <div style="position:relative;margin-bottom:36px;">
        <button id="closeGuideBtn" style="
          position:absolute;left:0;top:50%;transform:translateY(-50%);
          background:#7d7d7d;border:4px solid #000;border-top-color:#a8a8a8;border-left-color:#a8a8a8;
          color:#fff;font-family:'Press Start 2P',monospace;font-size:11px;padding:10px 26px;cursor:pointer;
          text-shadow:2px 2px 0 #000;box-shadow:inset -4px -4px 0 #555,4px 4px 0 #000;
        ">返回</button>
        <h2 style="color:#fff;text-align:center;margin:0;text-shadow:3px 3px 0 #000;">物品图鉴</h2>
        <input id="guideSearch" type="text" placeholder="搜索..." style="
          position:absolute;right:0;top:50%;transform:translateY(-50%);width:170px;padding:8px 12px;
          background:#c6c6c6;border:3px solid #000;border-top-color:#555;border-left-color:#555;
          color:#000;font-family:'Press Start 2P',monospace;font-size:10px;outline:none;
        " />
      </div>
      <div id="itemGuideList" style="flex:1;overflow-y:auto;display:grid;grid-template-columns: 1fr;gap:20px;padding-right:8px;"></div>
    </div>
  </div>
  
  <div id="gameContainer">
    <div style="width:824px;margin:0 auto;display:flex;justify-content:flex-end;align-items:center;gap:20px;margin-bottom:24px;">
      <button id="pauseBtn" style="
        background:#7d7d7d;border:4px solid #000;border-top-color:#a8a8a8;border-left-color:#a8a8a8;
        color:#fff;font-family:'Press Start 2P',monospace;font-size:14px;padding:14px 44px;cursor:pointer;
        text-shadow:2px 2px 0 #000;box-shadow:inset -4px -4px 0 #555,4px 4px 0 #000;transition:all 0.1s;
      ">暂停</button>
      <button id="backBtn" style="
        background:#7d7d7d;border:4px solid #000;border-top-color:#a8a8a8;border-left-color:#a8a8a8;
        color:#fff;font-family:'Press Start 2P',monospace;font-size:14px;padding:14px 44px;cursor:pointer;
        text-shadow:2px 2px 0 #000;box-shadow:inset -4px -4px 0 #555,4px 4px 0 #000;transition:all 0.1s;
      ">返回</button>
    </div>
    <div id="battleFrame">
      <canvas id="gameCanvas" width="800" height="560"></canvas>
    </div>
  </div>
  

  
  <script src="items.js"></script>
  <script src="game.js"></script>
  <script src="ui.js"></script>
</body>
</html>
